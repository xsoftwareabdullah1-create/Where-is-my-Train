name: Build RailPulse Android APK

on:
  push:
    branches:
      - main
      - feature/cell-tower-offline-status
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railpulse-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: app_clone/pubspec.lock

      - name: Resolve Flutter dependencies
        working-directory: app_clone
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: app_clone
        run: flutter test

      - name: Build release APK
        working-directory: app_clone
        run: flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailPulse-android-apk
          path: app_clone/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14